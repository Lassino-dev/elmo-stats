<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://elmo-backend.orb-hq.workers.dev; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Login</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='a' cx='.35' cy='.3'%3E%3Cstop stop-color='%23fff'/%3E%3Cstop offset='.6' stop-color='%234a4a51'/%3E%3Cstop offset='1' stop-color='%23121214'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23a)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="ambient__blob ambient__blob--1"></span><span class="ambient__blob ambient__blob--2"></span><span class="ambient__blob ambient__blob--3"></span><div class="ambient__beam"></div></div>
<main class="app login">
  <header class="greeting">
    <div class="orb orb--lg" aria-hidden="true"><div class="orb__glow"></div><div class="orb__ring"></div><div class="orb__ring2"></div><div class="orb__core"></div></div>
    <h1 class="greeting__title">Login</h1>
  </header>
  <form id="login" class="card card--hero">
    <label class="label" for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="main" type="submit">Anmelden</button>
    <p id="loginMsg" role="status"></p>
  </form>
  <section id="panel" class="card card--hero" hidden>
    <h2 id="title">Whitelist</h2>
    <p id="role" class="role"></p>
    <form id="nameForm">
      <label class="label" for="name">Minecraft-Name</label>
      <input id="name" autocomplete="off" spellcheck="false" maxlength="16" required>
      <button class="main" type="submit">Zur Whitelist hinzufügen</button>
    </form>
    <div id="admin" hidden>
      <div class="sep"></div>
      <div class="btns">
        <button class="alt" type="button" data-a="whitelist_remove" data-name="1">Entfernen</button>
        <button class="alt" type="button" data-a="kick" data-name="1">Kicken</button>
        <button class="alt" type="button" data-a="whitelist_list">Liste anzeigen</button>
        <button class="alt" type="button" id="logout">Abmelden</button>
        <button class="alt" type="button" data-a="whitelist_on">Whitelist an</button>
        <button class="alt" type="button" data-a="whitelist_off">Whitelist aus</button>
      </div>
    </div>
    <button class="alt" type="button" id="logout2" style="width:100%;margin-top:10px">Abmelden</button>
    <p id="msg" role="status"></p>
  </section>
  <a class="back" href="./">Zurück zu den Stats</a>
</main>
<script>
const API='https://elmo-backend.orb-hq.workers.dev/api';
const $=id=>document.getElementById(id);
let password='';
const ERR={400:'Das ist kein gültiger Minecraft-Name.',401:'Falsches Passwort.',403:'Dafür fehlt die Berechtigung.',502:'Der Server ist gerade nicht erreichbar.'};
async function call(action,name){
  const body={password,action};if(name)body.name=name;
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(ERR[r.status]||'Das hat gerade nicht geklappt.');
  return d;
}
function nice(t){
  let m;
  if(m=t.match(/^Added (\S+) to the whitelist/))return m[1]+' steht jetzt auf der Whitelist.';
  if(m=t.match(/^Removed (\S+) from the whitelist/))return m[1]+' wurde von der Whitelist entfernt.';
  if(/already whitelisted/.test(t))return 'Der Spieler steht schon auf der Whitelist.';
  if(/not whitelisted/.test(t))return 'Der Spieler steht nicht auf der Whitelist.';
  if(/does not exist|That player/.test(t))return 'Diesen Minecraft-Namen gibt es nicht.';
  if(/No player was found/.test(t))return 'Dieser Spieler ist gerade nicht online.';
  if(m=t.match(/^Kicked (\S+)/))return m[1]+' wurde gekickt.';
  if(/no whitelisted players/.test(t))return 'Die Whitelist ist leer.';
  if(m=t.match(/whitelisted player\(s\): (.*)$/))return 'Auf der Whitelist: '+m[1];
  if(/Whitelist is now turned on/.test(t))return 'Die Whitelist ist jetzt an.';
  if(/Whitelist is now turned off/.test(t))return 'Die Whitelist ist jetzt aus.';
  if(/already (on|off)|already turned/.test(t))return 'Die Whitelist war schon so eingestellt.';
  return t||'Erledigt.';
}
function show(t,bad){const m=$('msg');m.textContent=t;m.className=bad?'bad':''}
function busy(on){document.querySelectorAll('#panel button').forEach(b=>b.disabled=on)}
async function run(action,name){
  busy(true);show('Einen Moment …');
  try{const d=await call(action,name);show(nice(d.message||''))}catch(e){show(e.message,true)}
  busy(false);
}
$('login').addEventListener('submit',async e=>{
  e.preventDefault();
  password=$('pw').value;$('loginMsg').textContent='';
  try{
    const d=await call('login');
    $('pw').value='';$('login').hidden=true;$('panel').hidden=false;
    const admin=d.role==='admin';
    $('admin').hidden=!admin;$('logout2').hidden=admin;
    $('title').textContent=admin?'Admin':'Whitelist';
    $('role').textContent=admin?'Du kannst Spieler verwalten.':'Hier kannst du Freunde zur Whitelist hinzufügen.';
    $('name').focus();
  }catch(err){password='';$('loginMsg').textContent=err.message}
});
$('nameForm').addEventListener('submit',e=>{e.preventDefault();run('whitelist_add',$('name').value.trim())});
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
  const name=b.dataset.name?$('name').value.trim():'';
  if(b.dataset.name&&!name){show('Trag zuerst einen Minecraft-Namen ein.',true);return}
  run(b.dataset.a,name);
}));
function logout(){password='';location.reload()}
$('logout').addEventListener('click',logout);$('logout2').addEventListener('click',logout);
</script>
</body>
</html>
